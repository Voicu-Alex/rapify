<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapify • Dark</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<header class="top-header">
    <div class="top-logo">Rapify</div>

    <nav class="top-nav">
        <ul>
            <li><a href="index.html">Acasă</a></li>
            <li class="dropdown">
                <a class="drop-btn">Playlist-uri ▾</a>
                <ul class="dropdown-menu">
                    <li><a href="BoomBap.html">Boom Bap</a></li>
                    <li><a href="Dark.html">Dark</a></li>
                    <li><a href="Chill.html">Chill</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

<!-- player audio  -->
<audio id="audio-player">
    <source id="audio-source" src="" type="audio/mpeg">
    Browserul tău nu suportă tagul audio.
</audio>

<main class="page-wrapper">

    <!-- stanga: video + vizualizator si descrierea piesei -->
    <section class="left-panel">
        <div class="left-video-wrapper">
            <video id="track-video" autoplay muted loop playsinline>
                <source id="video-source" src="" type="video/webm">
            </video>
            <canvas id="visualizer"></canvas>
        </div>

        <div class="info-panel">
            <h1 class="song-title" id="info-title"></h1>
            <h2 class="song-artist" id="info-artist"></h2>

            <p class="song-desc" id="info-desc-1"></p>
            <p class="song-desc" id="info-desc-2"></p>
            <p class="song-desc song-license" id="info-desc-3"></p>
        </div>
    </section>

    <!-- dreapta: lista de piese -->
    <aside class="right-panel">
        <div class="right-overlay"></div>

        <div class="track-list-panel">
            <h2>DARK</h2>

            <ul class="track-list">

                <!-- MTA -->
                <li class="track-item"
                    data-src="audio/mta.mp3"
                    data-video="video/city-night.webm"
                    data-title="MTA"
                    data-artist="Kevin MacLeod"
                    data-info-title="MTA"
                    data-info-artist="Kevin MacLeod • 2009"
                    data-info-1="Piesă urbană, strânsă, gândită pentru rap sau ascultat de sine stătător."
                    data-info-2="Lovituri mari de percuție și o secțiune B surprinzătoare la mijloc."
                    data-info-3="Muzică: Kevin MacLeod (incompetech.com), licență CC BY 4.0.">
                    <span class="t-title">MTA</span>
                    <span class="t-artist">Kevin MacLeod</span>
                </li>

                <!-- Lewis and Dekalb -->
                <li class="track-item"
                    data-src="audio/lewis-and-dekalb.mp3"
                    data-video="video/city-night.webm"
                    data-title="Lewis and Dekalb"
                    data-artist="Kevin MacLeod"
                    data-info-title="Lewis and Dekalb"
                    data-info-artist="Kevin MacLeod • 2016"
                    data-info-1="Beat lent, influențat de trap-ul din sudul SUA, pe 72 BPM."
                    data-info-2="Bas apăsat și hi-hat-uri rapide, tipice pentru trap."
                    data-info-3="Muzică: Kevin MacLeod (incompetech.com), licență CC BY 4.0.">
                    <span class="t-title">Lewis and Dekalb</span>
                    <span class="t-artist">Kevin MacLeod</span>
                </li>

                <!-- Basic Implosion -->
                <li class="track-item"
                    data-src="audio/basic-implosion.mp3"
                    data-video="video/city-night.webm"
                    data-title="Basic Implosion"
                    data-artist="Kevin MacLeod"
                    data-info-title="Basic Implosion"
                    data-info-artist="Kevin MacLeod • 2016"
                    data-info-1="Beat energic și foarte catchy pe 95 BPM."
                    data-info-2="Tobe, bas și synth: o bază simplă care cere versuri peste ea."
                    data-info-3="Muzică: Kevin MacLeod (incompetech.com), licență CC BY 4.0.">
                    <span class="t-title">Basic Implosion</span>
                    <span class="t-artist">Kevin MacLeod</span>
                </li>

            </ul>
        </div>
    </aside>

</main>

<!-- bara de control, inspirata de Spotify -->
<footer class="player-bar">
    <div class="player-info">
        <span id="current-title"></span>
        <span id="current-artist"></span>
    </div>

    <button id="play-pause" class="player-btn">►</button>

    <input type="range" id="timeline" value="0" min="0" max="100">
</footer>

<!-- JS pentru player si schimbarea pieselor -->
<script src="app.js"></script>
</body>
</html>
