            </p>

            </p>

            <ul class="track-list">
                <!-- Ice Cube – Check Yo Self (Remix) -->

                    <span class="t-title">Check Yo Self (Remix)</span>
                    <span class="t-artist">Ice Cube</span>
                </li>

                <!-- Ice Cube – You Know How We Do It -->
                <li class="track-item"
                    data-src="Muzica/Ice Cube - You Know How We Do It.mp3"
                    data-video="Video/Ice Cube - You Know How We Do It.mp4"
                    data-title="You Know How We Do It"
                    data-artist="Ice Cube"
                    data-info-title="You Know How We Do It"
                    data-info-artist="Ice Cube • 1993"
                    data-info-1="„You Know How We Do It” e unul dintre cele mai chill și smooth track-uri ale lui Ice Cube."

                    data-info-3="În Rapify, piesa intră în selecția de track-uri laid-back, ideale de fundal.">
                    <span class="t-title">You Know How We Do It</span>
                    <span class="t-artist">Ice Cube</span>
                </li>

                <!-- Ice Cube, Dr. Dre, MC Ren – Hello -->
                <li class="track-item"
                    data-src="Muzica/Ice Cube, Dr. Dre, MC Ren - Hello.mp3"
                    data-video="Video/Ice Cube, Dr. Dre, MC Ren - Hello.mp4"
                    data-title="Hello"
                    data-artist="Ice Cube, Dr. Dre, MC Ren"
                    data-info-title="Hello"
                    data-info-artist="Ice Cube, Dr. Dre, MC Ren • 2000"
                    data-info-1="„Hello” reunifică o parte din N.W.A, cu Ice Cube, Dr. Dre și MC Ren pe același track."
