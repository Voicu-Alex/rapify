<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapify • Chill</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<header class="top-header">
    <div class="top-logo">Rapify</div>

    <nav class="top-nav">
        <ul>
            <li><a href="index.html">Acasă</a></li>
            <li class="dropdown">
                <a class="drop-btn">Playlist-uri ▾</a>
                <ul class="dropdown-menu">
                    <li><a href="BoomBap.html">Boom Bap</a></li>
                    <li><a href="Dark.html">Dark</a></li>
                    <li><a href="Chill.html">Chill</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

<!-- player audio  -->
<audio id="audio-player">
    <source id="audio-source" src="" type="audio/mpeg">
    Browserul tău nu suportă tagul audio.
</audio>

<main class="page-wrapper">

    <!-- stanga: video + vizualizator si descrierea piesei -->
    <section class="left-panel">
        <div class="left-video-wrapper">
            <video id="track-video" autoplay muted loop playsinline>
                <source id="video-source" src="" type="video/webm">
            </video>
            <canvas id="visualizer"></canvas>
        </div>

        <div class="info-panel">
            <h1 class="song-title" id="info-title"></h1>
            <h2 class="song-artist" id="info-artist"></h2>

            <p class="song-desc" id="info-desc-1"></p>
            <p class="song-desc" id="info-desc-2"></p>
            <p class="song-desc song-license" id="info-desc-3"></p>
        </div>
    </section>

    <!-- dreapta: lista de piese -->
    <aside class="right-panel">
        <div class="right-overlay"></div>

        <div class="track-list-panel">
            <h2>CHILL</h2>

            <ul class="track-list">

                <!-- Chillin Hard -->
                <li class="track-item"
                    data-src="audio/chillin-hard.mp3"
                    data-video="video/subway.webm"
                    data-title="Chillin Hard"
                    data-artist="Kevin MacLeod"
                    data-info-title="Chillin Hard"
                    data-info-artist="Kevin MacLeod • 2016"
                    data-info-1="Hip-hop amestecat cu shoegaze: tobe, bas și un cor atmosferic."
                    data-info-2="Perfect pe fundal, între două sesiuni de cod."
                    data-info-3="Muzică: Kevin MacLeod (incompetech.com), licență CC BY 4.0.">
                    <span class="t-title">Chillin Hard</span>
                    <span class="t-artist">Kevin MacLeod</span>
                </li>

                <!-- Slow Jam -->
                <li class="track-item"
                    data-src="audio/slow-jam.mp3"
                    data-video="video/subway.webm"
                    data-title="Slow Jam"
                    data-artist="Kevin MacLeod"
                    data-info-title="Slow Jam"
                    data-info-artist="Kevin MacLeod • 2016"
                    data-info-1="Trap întâlnește R&amp;B: bas sinusoidal neted și un drum machine agitat."
                    data-info-2="Pian electric și synth-uri pentru o atmosferă de noapte."
                    data-info-3="Muzică: Kevin MacLeod (incompetech.com), licență CC BY 4.0.">
                    <span class="t-title">Slow Jam</span>
                    <span class="t-artist">Kevin MacLeod</span>
                </li>

                <!-- Galactic Rap -->
                <li class="track-item"
                    data-src="audio/galactic-rap.mp3"
                    data-video="video/subway.webm"
                    data-title="Galactic Rap"
                    data-artist="Kevin MacLeod"
                    data-info-title="Galactic Rap"
                    data-info-artist="Kevin MacLeod • 2023"
                    data-info-1="Beat spațial pe 120 BPM, lasă mult loc pentru voce."
                    data-info-2="Atenție la schimbarea de tonalitate de la 1:34."
                    data-info-3="Muzică: Kevin MacLeod (incompetech.com), licență CC BY 4.0.">
                    <span class="t-title">Galactic Rap</span>
                    <span class="t-artist">Kevin MacLeod</span>
                </li>

            </ul>
        </div>
    </aside>

</main>

<!-- bara de control, inspirata de Spotify -->
<footer class="player-bar">
    <div class="player-info">
        <span id="current-title"></span>
        <span id="current-artist"></span>
    </div>

    <button id="play-pause" class="player-btn">►</button>

    <input type="range" id="timeline" value="0" min="0" max="100">
</footer>

<!-- JS pentru player si schimbarea pieselor -->
<script src="app.js"></script>
</body>
</html>
