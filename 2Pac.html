<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapify • 2Pac</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<header class="top-header">
    <div class="top-logo">Rapify</div>

    <nav class="top-nav">
        <ul>
            <li><a href="index.html">Acasă</a></li>
            <li class="dropdown">
                <a class="drop-btn">Playlist-uri ▾</a>
                <ul class="dropdown-menu">
                    <li><a href="BigL.html">Big L</a></li>
                    <li><a href="2Pac.html">2Pac</a></li>
                    <li><a href="IceCube.html">Ice Cube</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

<!-- player audio  -->
<audio id="audio-player">
    <source id="audio-source" src="Muzica/Big L - Put It On (Official Music Video).mp3" type="audio/mpeg">
    Browserul tău nu suportă tagul audio.
</audio>

<main class="page-wrapper">

    <!-- stanga (video piesă si info) -->
    <section class="left-panel">
        <div class="left-video-wrapper">
            <canvas id="visualizer"></canvas>
            <video id="track-video" autoplay muted loop playsinline>
                <!-- video pentru piesa curentă -->
                <source id="video-source" src="" type="video/mp4">
                Browserul tău nu suportă tagul video.
            </video>
        </div>

        <div class="info-panel">
            <h1 class="song-title" id="info-title"></h1>
            <h2 class="song-artist" id="info-artist"></h2>

            <p class="song-desc" id="info-desc-1">
                
            </p>

            <p class="song-desc" id="info-desc-2">
                
            </p>

            <p class="song-desc" id="info-desc-3">
                
            </p>
        </div>
    </section>

    <!-- dreapta: video de pe fundal si piese -->
    <aside class="right-panel">
        <!-- video de fundal pentru coloana dreaptă -->
        <video class="right-bg-video" autoplay muted loop playsinline>
            <!-- aici poți pune colajul de la auth -->
            <source src="My Movie.mp4" type="video/mp4">
            Browserul tău nu suportă tagul video.
        </video>

        <div class="right-overlay"></div>

        <!-- panou cu lista de piese, semi-transparent -->
        <div class="track-list-panel">
            <h2>2PAC</h2>

            <ul class="track-list">

                <!-- 2Pac – Hit 'Em Up (Dirty) -->
                <li class="track-item"
                    data-src="Muzica/2Pac - Hit 'Em Up (Dirty) (Music Video).mp3"
                    data-video="Video/2Pac - Hit 'Em Up (Dirty) (Music Video) HD.mp4"
                    data-title="Hit 'Em Up"
                    data-artist="2Pac"
                    data-info-title="Hit 'Em Up"
                    data-info-artist="2Pac • 1996"
                    data-info-1="„Hit 'Em Up” este probabil cel mai celebru diss track din istoria hip-hop-ului, lansat în plin conflict East vs West."
                    data-info-2="2Pac livrează versuri extrem de agresive, directe și personale, un atac frontal împotriva lui Biggie și Bad Boy Records."
                    data-info-3="În Rapify, piesa reprezintă esența războiului liric al anilor ’90 și energia brută a lui 2Pac.">
                    <span class="t-title">Hit 'Em Up</span>
                    <span class="t-artist">2Pac</span>
                </li>


                <!-- 2Pac ft. Snoop Dogg – 2 Of Amerikaz Most Wanted -->
                <li class="track-item"
                    data-src="Muzica/2Pac ft. Snoop Dogg - 2 Of Amerikaz Most Wanted (Official Music Video).mp3"
                    data-video="Video/2Pac ft. Snoop Dogg - 2 Of Amerikaz Most Wanted (Official Music Video).mp4"
                    data-title="2 Of Amerikaz Most Wanted"
                    data-artist="2Pac ft. Snoop Dogg"
                    data-info-title="2 Of Amerikaz Most Wanted"
                    data-info-artist="2Pac ft. Snoop Dogg • 1996"
                    data-info-1="„2 Of Amerikaz Most Wanted” îi pune față în față pe 2Pac și Snoop Dogg pe un beat West Coast memorabil."
                    data-info-2="Piesa e un statement de atitudine, cu referințe la problemele legale și statutul lor în industrie."
                    data-info-3="În Rapify, track-ul intră în categoria colaborărilor clasice Death Row Records.">
                    <span class="t-title">2 Of Amerikaz Most Wanted</span>
                    <span class="t-artist">2Pac ft. Snoop Dogg</span>
                </li>

                <!-- 2Pac – Still Ballin' -->
                <li class="track-item"
                    data-src="Muzica/2pac- Still Ballin.mp3"
                    data-video="Video/2pac- Still Ballin.mp4"
                    data-title="Still Ballin'"
                    data-artist="2Pac"
                    data-info-title="Still Ballin'"
                    data-info-artist="2Pac • 2002"
                    data-info-1="„Still Ballin'” continuă energia agresivă și încrezătoare a lui 2Pac chiar și în materialele postume."
                    data-info-2="Beat-ul greu și refrenul catchy o fac o piesă perfectă pentru hype și workout."
                    data-info-3="În Rapify, piesa reprezintă moștenirea lui Pac în anii 2000, după perioada clasică ’90.">
                    <span class="t-title">Still Ballin'</span>
                    <span class="t-artist">2Pac</span>
                </li>
            </ul>
        </div>
    </aside>

</main>

<!-- PLAYER BAR în stil Spotify -->
<footer class="player-bar">
    <div class="player-info">
        <span id="current-title">Put It On</span>
        <span id="current-artist">Big L</span>
    </div>

    <button id="play-pause" class="player-btn">►</button>

    <input type="range" id="timeline" value="0" min="0" max="100">
</footer>


<script src="app.js"></script>
</body>
</html>
